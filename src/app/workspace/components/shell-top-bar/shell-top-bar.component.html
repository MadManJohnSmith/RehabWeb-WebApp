<header
  class="flex h-14 shrink-0 items-center justify-between gap-4 border-b border-pm-border bg-pm-surface px-4 dark:border-pm-border-dark dark:bg-pm-surface-dark md:px-6"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-control border border-pm-border text-pm-ink md:hidden dark:border-pm-border-dark dark:text-pm-ink-on-dark"
      (click)="menuToggle.emit()"
      aria-label="Abrir o cerrar menú"
    >
      <app-ui-icon name="menu" [size]="20" />
    </button>
    <div class="min-w-0">
      <h1 class="truncate text-base font-bold text-pm-ink dark:text-pm-ink-on-dark">{{ title() }}</h1>
    </div>
  </div>

  <button
    type="button"
    (click)="toggleTheme()"
    class="inline-flex h-10 w-10 items-center justify-center rounded-control border border-pm-border text-pm-ink transition hover:border-pm-primary hover:text-pm-primary dark:border-pm-border-dark dark:text-pm-ink-on-dark"
    [attr.aria-label]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'"
  >
    @if (theme.isDark()) {
      <app-ui-icon name="sun" [size]="20" />
    } @else {
      <app-ui-icon name="moon" [size]="20" />
    }
  </button>
</header>
