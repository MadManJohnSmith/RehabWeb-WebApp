<div
  class="relative flex h-dvh min-h-0 max-h-dvh w-full overflow-hidden bg-pm-canvas dark:bg-pm-canvas-dark"
>
  @if (mobileMenuOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-pm-ink/40 md:hidden"
      (click)="backdropClick()"
      aria-label="Cerrar menú"
    ></button>
  }

  <app-shell-sidebar
    class="z-40 shrink-0 grow-0 basis-auto max-md:fixed max-md:inset-y-0 max-md:left-0 max-md:h-dvh max-md:shadow-pm-md max-md:transition-transform md:static md:h-full md:min-h-dvh md:self-stretch md:translate-x-0 dark:max-md:shadow-pm-md-dark"
    [class.max-md:-translate-x-full]="!mobileMenuOpen()"
    [class.max-md:translate-x-0]="mobileMenuOpen()"
    (closeMobile)="closeMobileMenu()"
  />

  <div class="flex min-w-0 flex-1 flex-col md:min-w-0">
    <app-shell-top-bar [title]="pageTitle()" (menuToggle)="toggleMobileMenu()" />
    <div
      class="min-h-0 w-full min-w-0 flex-1 overflow-y-auto overflow-x-hidden overscroll-y-contain px-4 pb-6 pt-5 md:px-6 md:pb-8 md:pt-7"
    >
      <router-outlet />
    </div>
  </div>

  <div
    class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[min(100vw-2rem,22rem)] flex-col gap-2"
    role="status"
    aria-live="polite"
  >
    @for (m of toast.messages(); track m.id) {
      <div
        class="pointer-events-auto flex items-start justify-between gap-3 rounded-card border border-pm-border bg-pm-surface px-4 py-3 text-sm text-pm-ink shadow-pm-md dark:border-pm-border-dark dark:bg-pm-surface-dark dark:text-pm-ink-on-dark dark:shadow-pm-md-dark"
      >
        <p class="leading-snug">{{ m.text }}</p>
        <button
          type="button"
          class="shrink-0 rounded-control px-2 py-0.5 text-xs font-medium text-pm-muted hover:bg-pm-canvas hover:text-pm-ink dark:text-pm-muted-dark dark:hover:bg-pm-canvas-dark dark:hover:text-pm-ink-on-dark"
          (click)="toast.dismiss(m.id)"
        >
          Cerrar
        </button>
      </div>
    }
  </div>
</div>
