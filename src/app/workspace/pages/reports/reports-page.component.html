<div class="mx-auto max-w-4xl space-y-6">
  <section
    class="rounded-card border border-pm-border bg-pm-surface p-6 shadow-pm-sm dark:border-pm-border-dark dark:bg-pm-surface-dark dark:shadow-pm-sm-dark"
  >
    <p class="text-xs font-semibold uppercase tracking-wide text-pm-muted dark:text-pm-muted-dark">
      Generación de reportes
    </p>
    <h1 class="mt-2 text-xl font-bold text-pm-ink dark:text-pm-ink-on-dark">Exportación de datos clínicos</h1>
    <p class="mt-2 max-w-2xl text-sm text-pm-muted dark:text-pm-muted-dark">
      Genera reportes técnicos y comparativos para la historia clínica. Los archivos se producirán en el servidor
      cuando el servidor esté disponible.
    </p>

    <div class="mt-8 grid gap-5 md:grid-cols-2">
      <div class="md:col-span-2">
        <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-pm-muted dark:text-pm-muted-dark">
          Selección de paciente
        </label>
        <select
          name="pacienteId"
          [(ngModel)]="pacienteId"
          class="w-full rounded-control border border-pm-border bg-pm-canvas px-3 py-3 text-sm font-medium text-pm-ink outline-none ring-pm-primary focus:ring-2 dark:border-pm-border-dark dark:bg-pm-canvas-dark dark:text-pm-ink-on-dark"
        >
          @for (p of patientOptions; track p.id) {
            <option [value]="p.id">{{ p.label }}</option>
          }
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-pm-muted dark:text-pm-muted-dark">
          Desde
        </label>
        <input
          name="desde"
          type="date"
          [(ngModel)]="desde"
          class="w-full rounded-control border border-pm-border bg-pm-canvas px-3 py-3 text-sm outline-none ring-pm-primary focus:ring-2 dark:border-pm-border-dark dark:bg-pm-canvas-dark dark:text-pm-ink-on-dark"
        />
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-pm-muted dark:text-pm-muted-dark">
          Hasta
        </label>
        <input
          name="hasta"
          type="date"
          [(ngModel)]="hasta"
          class="w-full rounded-control border border-pm-border bg-pm-canvas px-3 py-3 text-sm outline-none ring-pm-primary focus:ring-2 dark:border-pm-border-dark dark:bg-pm-canvas-dark dark:text-pm-ink-on-dark"
        />
      </div>
    </div>

    <div class="mt-8 flex flex-col gap-4 sm:flex-row sm:items-stretch">
      <button
        type="button"
        (click)="export('excel')"
        class="inline-flex flex-1 items-center justify-center gap-3 rounded-cta bg-pm-primary px-6 py-4 text-base font-semibold text-white shadow-pm-md transition hover:bg-pm-primary-hover dark:shadow-pm-md-dark"
      >
        <app-ui-icon name="file-spreadsheet" [size]="22" svgClass="text-white" />
        Descargar Excel
      </button>
      <button
        type="button"
        (click)="export('pdf')"
        class="inline-flex flex-1 items-center justify-center gap-3 rounded-cta border-2 border-pm-coral bg-pm-surface px-6 py-4 text-base font-semibold text-pm-coral shadow-pm-sm transition hover:bg-pm-danger-bg dark:border-pm-coral dark:bg-pm-surface-dark dark:text-pm-coral dark:hover:bg-pm-danger-bg-dark"
      >
        <app-ui-icon name="download" [size]="22" />
        Descargar PDF
      </button>
    </div>

    @if (estado()) {
      <p class="mt-6 text-xs text-pm-muted dark:text-pm-muted-dark">{{ estado() }}</p>
    }
  </section>
</div>
